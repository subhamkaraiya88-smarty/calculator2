<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#3b82f6,#9333ea);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.calculator{
width:360px;
background:#ffffff;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

h2{
text-align:center;
margin-bottom:15px;
color:#333;
}

#display{
width:100%;
height:60px;
font-size:28px;
text-align:right;
padding:10px;
border:none;
outline:none;
border-radius:12px;
background:#f2f2f2;
margin-bottom:15px;
}

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.buttons button{
height:60px;
font-size:22px;
border:none;
border-radius:12px;
cursor:pointer;
background:#e5e7eb;
transition:.2s;
}

.buttons button:hover{
transform:scale(1.05);
background:#d1d5db;
}

.operator{
background:#f59e0b!important;
color:white;
}

.clear{
background:#ef4444!important;
color:white;
}

.back{
background:#6366f1!important;
color:white;
}

.buttons button:last-child{
grid-column:span 4;
background:#10b981;
color:white;
height:55px;
font-size:20px;
}

.footer{
margin-top:15px;
text-align:center;
font-size:14px;
color:#666;
}

@media(max-width:450px){

.calculator{
width:100%;
}

.buttons button{
height:55px;
font-size:20px;
}

#display{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="calculator">

<h2>Calculator Pro</h2>

<input type="text" id="display" readonly placeholder="0">

<div class="buttons">

<button class="clear">AC</button>
<button class="back">⌫</button>
<button class="operator">%</button>
<button class="operator">/</button>

<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">*</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button class="operator">-</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="operator">+</button>

<button>√</button>
<button>0</button>
<button>.</button>
<button>=</button>

<button>x²</button>

</div>

<div class="footer">
Made by <b>ATHARV SHRIVASTAVA</b>
</div>

</div>

<script>

const display = document.getElementById("display");
const buttons = document.querySelectorAll(".buttons button");

let expression = "";

buttons.forEach(button => {

    button.addEventListener("click", () => {

        const value = button.textContent;

        if (value === "AC") {
            expression = "";
            display.value = "";
        }

        else if (value === "⌫") {
            expression = expression.slice(0, -1);
            display.value = expression;
        }

        else if (value === "=") {
            try {
                let exp = expression
                    .replace(/×/g, "*")
                    .replace(/÷/g, "/");

                display.value = eval(exp);
                expression = display.value;
            } catch {
                display.value = "Error";
                expression = "";
            }
        }

        else if (value === "√") {
            try {
                expression = Math.sqrt(Number(expression)).toString();
                display.value = expression;
            } catch {
                display.value = "Error";
                expression = "";
            }
        }

        else if (value === "x²") {
            try {
                expression = Math.pow(Number(expression), 2).toString();
                display.value = expression;
            } catch {
                display.value = "Error";
                expression = "";
            }
        }

        else if (value === "%") {
            try {
                expression = (Number(expression) / 100).toString();
                display.value = expression;
            } catch {
                display.value = "Error";
                expression = "";
            }
        }

        else {
            expression += value;
            display.value = expression;
        }

    });

});

// Keyboard Support
document.addEventListener("keydown", (e) => {

    if (!isNaN(e.key) || "+-*/.".includes(e.key)) {
        expression += e.key;
        display.value = expression;
    }

    else if (e.key === "Enter") {
        try {
            display.value = eval(expression);
            expression = display.value;
        } catch {
            display.value = "Error";
            expression = "";
        }
    }

    else if (e.key === "Backspace") {
        expression = expression.slice(0, -1);
        display.value = expression;
    }

    else if (e.key === "Escape") {
        expression = "";
        display.value = "";
    }

});

</script>

</body>
</html>
